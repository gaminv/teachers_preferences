name: schedule-etl-tests

on:
  push:
    paths:
      - "schedule-etl/**"
      - ".github/workflows/schedule-etl-tests.yml"
  pull_request:
    paths:
      - "schedule-etl/**"
      - ".github/workflows/schedule-etl-tests.yml"
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schedule-etl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run unit tests
        run: mvn -B -ntp test "-Dtest=*Unit*,*ScheduleEtlServiceTest"

  integration-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schedule-etl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run integration tests
        run: mvn -B -ntp test "-Dtest=*IntegrationTest"

  system-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schedule-etl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run system tests
        run: mvn -B -ntp test "-Dtest=*SystemE2ETest"

  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schedule-etl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and generate coverage
        run: mvn -B -ntp clean verify
      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: schedule-etl/target/site/jacoco
