spring.datasource.url=jdbc:h2:mem:teachersprefs;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.web.FilterChainProxy=INFO

jwt.secret=this-is-a-local-e2e-secret-key-for-teachers-preferences
jwt.expirationMs=86400000
